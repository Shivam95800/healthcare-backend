services:
  # Web Service running Django
  - type: web
    name: healthcare-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn healthcare_backend.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # Free PostgreSQL Database on Render
  - name: healthcare-db
    plan: free
